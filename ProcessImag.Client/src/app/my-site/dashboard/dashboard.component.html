<div class="flex flex-col gap-6 p-6">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">Dashboard</h1>
        <p class="text-muted-foreground">Welcome back! Here's an overview of your metrics.</p>
      </div>

      <!-- Stats Grid -->
      <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-4">
        <div *ngFor="let stat of stats" class="rounded-lg border bg-card text-card-foreground shadow-sm">
          <div class="p-6">
            <div class="flex items-center justify-between space-y-0 pb-2">
              <h3 class="text-sm font-medium">{{ stat.title }}</h3>
              <span [innerHTML]="stat.icon" class="h-4 w-4 text-muted-foreground"></span>
            </div>
            <div class="text-2xl font-bold">{{ stat.value }}</div>
            <p class="text-xs text-muted-foreground">{{ stat.change }}</p>
          </div>
        </div>
      </div>

      <!-- Charts Grid -->
      <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-7">
        <div class="col-span-4 rounded-lg border bg-card text-card-foreground shadow-sm">
          <div class="p-6">
            <h3 class="text-lg font-semibold mb-2">Overview</h3>
            <p class="text-sm text-muted-foreground mb-4">Your performance over the last 6 months</p>
            <div class="h-[300px] flex items-center justify-center">
              <p class="text-muted-foreground">Chart visualization area</p>
            </div>
          </div>
        </div>

        <div class="col-span-3 rounded-lg border bg-card text-card-foreground shadow-sm">
          <div class="p-6">
            <h3 class="text-lg font-semibold mb-2">Recent Activity</h3>
            <p class="text-sm text-muted-foreground mb-4">Latest updates and notifications</p>
            <div class="space-y-4">
              <div *ngFor="let i of [1,2,3,4]" class="flex items-center gap-4">
                <div class="flex h-9 w-9 items-center justify-center rounded-full bg-primary/10">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-primary">
                    <path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/>
                  </svg>
                </div>
                <div class="flex-1 space-y-1">
                  <p class="text-sm font-medium leading-none">Activity {{ i }}</p>
                  <p class="text-sm text-muted-foreground">Description of the activity</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
