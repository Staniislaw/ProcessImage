<header class="sticky top-0 z-10 flex h-14 items-center gap-4 border-b bg-background/95 px-4 backdrop-blur supports-[backdrop-filter]:bg-background/60">
      <button 
        (click)="toggleSidebar()"
        class="inline-flex items-center justify-center rounded-md text-sm font-medium hover:bg-accent hover:text-accent-foreground h-9 w-9">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
          <line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>
        </svg>
      </button>
      
      <div class="flex-1"></div>

      <div *ngIf="authService.user().isAuthenticated; else signInButton" class="flex items-center gap-3">
        <div class="hidden sm:block text-right">
          <p class="text-sm font-medium leading-none">{{ authService.user().name || 'User' }}</p>
          <p *ngIf="authService.user().email" class="text-xs text-muted-foreground">{{ authService.user().email }}</p>
        </div>

        <div class="relative" #dropdown>
          <button 
            (click)="toggleDropdown()"
            class="inline-flex items-center justify-center rounded-full hover:bg-accent hover:text-accent-foreground h-9 w-9">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
              <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>

          <div *ngIf="isDropdownOpen" 
               class="absolute right-0 mt-2 w-56 rounded-md border bg-popover p-1 shadow-md z-50">
            <div class="flex items-center gap-2 px-2 py-1.5 mb-1">
              <div class="flex h-8 w-8 items-center justify-center rounded-full bg-primary text-primary-foreground text-sm font-medium">
                {{ authService.initials() }}
              </div>
              <div class="flex flex-col">
                <span class="text-sm font-medium">{{ authService.user().name || 'User' }}</span>
                <span *ngIf="authService.user().email" class="text-xs text-muted-foreground">{{ authService.user().email }}</span>
              </div>
            </div>
            <div class="h-px bg-border my-1"></div>
            <button class="w-full text-left px-2 py-1.5 text-sm rounded-sm hover:bg-accent">
              Account Settings
            </button>
            <button class="w-full text-left px-2 py-1.5 text-sm rounded-sm hover:bg-accent">
              Preferences
            </button>
            <button class="w-full text-left px-2 py-1.5 text-sm rounded-sm hover:bg-accent">
              Notifications
            </button>
            <div class="h-px bg-border my-1"></div>
            <button 
              (click)="signOut()"
              class="w-full text-left px-2 py-1.5 text-sm rounded-sm hover:bg-accent">
              Sign Out
            </button>
          </div>
        </div>
      </div>

      <ng-template #signInButton>
        <button 
          (click)="signIn()"
          class="inline-flex items-center justify-center rounded-md text-sm font-medium bg-primary text-primary-foreground hover:bg-primary/90 h-9 px-4 py-2">
          Sign In
        </button>
      </ng-template>
    </header>
